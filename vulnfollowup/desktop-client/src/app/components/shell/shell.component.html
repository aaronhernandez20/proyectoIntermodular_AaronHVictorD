<a class="skip-link" href="#main-content">{{ 'common.skipToContent' | translate }}</a>

<ion-split-pane contentId="main-content" when="md">
  <ion-menu contentId="main-content" type="overlay" [attr.aria-label]="'menu.label' | translate">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>
          <span class="brand">
            <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
            VulnFollowUp
          </span>
        </ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <nav [attr.aria-label]="'menu.label' | translate">
        <ion-list lines="none">
          @for (item of menu(); track item.path) {
            <ion-menu-toggle [autoHide]="false">
              <ion-item
                button
                detail="false"
                [routerLink]="item.path"
                routerLinkActive="active"
                #rla="routerLinkActive"
                [attr.aria-current]="rla.isActive ? 'page' : null"
              >
                <ion-icon slot="start" [name]="item.icon" aria-hidden="true"></ion-icon>
                <ion-label>{{ item.labelKey | translate }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </nav>
    </ion-content>

    <ion-footer>
      <div class="user-box">
        <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
        <div class="user-info">
          <strong>{{ auth.user()?.fullName }}</strong>
          <ion-chip class="role-chip" [class]="'role-' + auth.role()?.toLowerCase()">
            {{ 'roles.' + auth.role() | translate }}
          </ion-chip>
        </div>
      </div>
      <div class="footer-actions">
        <ion-button
          fill="outline"
          size="small"
          (click)="lang.toggle()"
          [attr.aria-label]="'common.changeLanguage' | translate"
        >
          <ion-icon slot="start" name="language-outline" aria-hidden="true"></ion-icon>
          {{ lang.current() === 'es' ? 'EN' : 'ES' }}
        </ion-button>
        <ion-button fill="outline" size="small" color="danger" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon>
          {{ 'common.logout' | translate }}
        </ion-button>
      </div>
    </ion-footer>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-router-outlet />
  </div>
</ion-split-pane>
